services:
  - type: web
    name: entre-nos
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: entre-nos-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        sync: false

databases:
  - name: entre-nos-db
    plan: free
    databaseName: entre_nos
    user: entre_nos
